<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Workshop Page Studio workflow</title>
  <desc id="desc">Enter mod details, preview the page, then export formatted text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a31"/><stop offset="1" stop-color="#17112b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66e3c4"/><stop offset="1" stop-color="#9b8cff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1070" cy="25" r="170" fill="#6b5ce7" opacity=".12"/><circle cx="160" cy="300" r="190" fill="#54d6b4" opacity=".08"/>
  <text x="58" y="55" fill="#a8b4d0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">LOCAL-FIRST • NO UPLOADS • FREE</text>
  <g filter="url(#shadow)">
    <rect x="58" y="92" width="300" height="164" rx="18" fill="#202a43" stroke="#45516f"/>
    <rect x="450" y="92" width="300" height="164" rx="18" fill="#202a43" stroke="#45516f"/>
    <rect x="842" y="92" width="300" height="164" rx="18" fill="#202a43" stroke="#45516f"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <circle cx="91" cy="126" r="17" fill="url(#accent)"/><text x="91" y="132" text-anchor="middle" fill="#101629" font-size="16" font-weight="800">1</text>
    <text x="122" y="132" fill="#f4f6ff" font-size="20" font-weight="700">Describe your mod</text>
    <text x="84" y="176" fill="#b8c2d9" font-size="15">Features, compatibility, install steps,</text><text x="84" y="200" fill="#b8c2d9" font-size="15">dependencies, languages and updates.</text>
    <circle cx="483" cy="126" r="17" fill="url(#accent)"/><text x="483" y="132" text-anchor="middle" fill="#101629" font-size="16" font-weight="800">2</text>
    <text x="514" y="132" fill="#f4f6ff" font-size="20" font-weight="700">Review live preview</text>
    <text x="476" y="176" fill="#b8c2d9" font-size="15">Switch language and output style,</text><text x="476" y="200" fill="#b8c2d9" font-size="15">check length and inspect formatting.</text>
    <circle cx="875" cy="126" r="17" fill="url(#accent)"/><text x="875" y="132" text-anchor="middle" fill="#101629" font-size="16" font-weight="800">3</text>
    <text x="906" y="132" fill="#f4f6ff" font-size="20" font-weight="700">Export and publish</text>
    <text x="868" y="176" fill="#b8c2d9" font-size="15">Copy BBCode or Markdown, download</text><text x="868" y="200" fill="#b8c2d9" font-size="15">the text or keep an editable JSON draft.</text>
  </g>
  <path d="M375 174h55m-14-14 14 14-14 14M767 174h55m-14-14 14 14-14 14" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="292" fill="#8591b0" font-family="Segoe UI,Arial,sans-serif" font-size="13">Your content stays in your browser until you choose to export it.</text>
</svg>
